name: Docker CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          run: |
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install pytest pytest-cov

        - name: Run tests
          run: |
            source .venv/bin/activate
            python -m pytest --maxfail=1 --disable-warnings --cov=app --cov-report=term-missing --cov-report=xml -q

  build:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      # 1. Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Check Docker Hub connectivity
      #   run: |
      #     curl -I --max-time 20 https://registry-1.docker.io/v2/
      #     curl -I --max-time 20 "https://auth.docker.io/"  

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-pipeline-lab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devops-pipeline-lab:${{ github.sha }}

      # 5. Pull the published image
      - name: Pull Docker image
        run: docker pull noransalm/devops-pipeline-lab:latest

      # 6. Verify the image
      - name: Verify Docker image
        run: docker image inspect noransalm/devops-pipeline-lab:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 400 ~/.ssh/known_hosts

      - name: Get short commit tag
        run: echo "short_tag=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          IMAGE_TAG: ${{ env.short_tag }}
        run: |
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" << EOF
            set -e
            cd /home/ubuntu/web-app
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose up -d
            docker compose ps
          EOF