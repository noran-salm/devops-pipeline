name: Docker CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            noransalm/devops-pipeline-lab:latest
            noransalm/devops-pipeline-lab:${{ github.sha }}

      # 5. Pull the published image
      - name: Pull Docker image
        run: docker pull noransalm/devops-pipeline-lab:latest

      # 6. Verify the image
      - name: Verify Docker image
        run: docker image inspect noransalm/devops-pipeline-lab:latest
