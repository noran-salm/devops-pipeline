name: Docker CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Check Docker Hub connectivity
      #   run: |
      #     curl -I --max-time 20 https://registry-1.docker.io/v2/
      #     curl -I --max-time 20 "https://auth.docker.io/"  

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-pipeline-lab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devops-pipeline-lab:${{ github.sha }}

      # 5. Pull the published image
      - name: Pull Docker image
        run: docker pull noransalm/devops-pipeline-lab:latest

      # 6. Verify the image
      - name: Verify Docker image
        run: docker image inspect noransalm/devops-pipeline-lab:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
        - name: setup ssh
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 400 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

        - name: Get short commit tag
          run: echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_ENV

        - name: setup docker
          run:   
        
        - name: Deploy to EC2
          run: |
            ssh -i ~/.ssh/id_rsa ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << EOF
              mkdir -p /home/ubuntu/web-app
              cd /home/ubuntu/web-app
              export IMAGE_TAG=${{ env.short_tag }}
              docker compose up -d
              docker compose ps
            EOF
